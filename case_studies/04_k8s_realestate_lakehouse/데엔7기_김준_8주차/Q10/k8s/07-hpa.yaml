apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realestate-hpa
  namespace: realestate-junekim
  labels:
    app: realestate-nginx
    student: junekim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realestate-nginx
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
