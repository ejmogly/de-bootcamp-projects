# 과제 07 — Spark on K8s (client 모드)
#
#   Job 파드가 드라이버 역할을 하며 spark-submit --master k8s:// 로 executor 파드를 만든다.
#   executor 는 드라이버 파드 IP(POD_IP)로 접속하므로 드라이버용 Service 가 따로 필요 없다.
#   AWS 키는 넣지 않는다 — 노드(EC2)의 IAM Role 을 사용한다.
#
#   kubectl apply -f k8s/spark-job.yaml
#   kubectl get job q7-spark-stock            # COMPLETIONS 1/1
#   kubectl logs job/q7-spark-stock
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: default
---
# 드라이버가 executor 파드를 만들고 정리하는 데 필요한 최소 권한
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: default
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: default
roleRef:
  kind: Role
  name: spark-driver
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: q7-spark-stock
  namespace: default
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: spark
      restartPolicy: Never
      containers:
        - name: driver
          image: de7-q7-spark:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: AWS_REGION
              value: ap-northeast-2
            - name: REDSHIFT_WORKGROUP
              value: <워크그룹명>
            - name: REDSHIFT_DATABASE
              value: dev
            - name: REDSHIFT_IAM_ROLE_ARN
              value: arn:aws:iam::<ACCOUNT_ID>:role/<Redshift COPY용 Role>
          command: ["/opt/spark/bin/spark-submit"]
          args:
            - --master
            - k8s://https://kubernetes.default.svc:443
            - --deploy-mode
            - client
            - --name
            - q7-spark-stock
            - --conf
            - spark.kubernetes.namespace=default
            - --conf
            - spark.kubernetes.container.image=de7-q7-spark:1.0.0
            - --conf
            - spark.kubernetes.container.image.pullPolicy=IfNotPresent
            # executor 파드가 드라이버 파드에 종속되어 Job 종료 시 함께 정리되도록 지정
            - --conf
            - spark.kubernetes.driver.pod.name=$(POD_NAME)
            - --conf
            - spark.driver.host=$(POD_IP)
            - --conf
            - spark.driver.bindAddress=0.0.0.0
            - --conf
            - spark.executor.instances=2
            - local:///opt/spark/work-dir/spark_job.py
            - --input
            - s3a://<본인버킷>/stock/raw/stock_prices.csv
            - --output
            - s3a://<본인버킷>/stock/daily_stats/
